<svg width="760" height="200" viewBox="0 0 760 200" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace">
  <rect width="760" height="200" rx="10" fill="#0d1117"/>
  <rect width="760" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="760" height="10" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>

  <g font-size="12.5">
    <text x="20" y="62" fill="#7ee787">$ <tspan fill="#c9d1d9">nuguard init --target </tspan><tspan fill="#58a6ff">&lt;your-app-url&gt;</tspan></text>
    <text x="20" y="90" fill="#7ee787">$ <tspan fill="#c9d1d9">nuguard sbom generate --source </tspan><tspan fill="#58a6ff">&lt;path-to-your-app&gt;</tspan><tspan fill="#c9d1d9"> --output app.sbom.json</tspan></text>
    <text x="20" y="122" fill="#7ee787">$ <tspan fill="#c9d1d9">nuguard behavior \</tspan></text>
    <text x="38" y="142" fill="#c9d1d9">--config nuguard.yaml \</text>
    <text x="38" y="162" fill="#c9d1d9">--format markdown \</text>
    <text x="38" y="182" fill="#c9d1d9">--output <tspan fill="#58a6ff">&lt;output-path&gt;</tspan></text>
  </g>
</svg>
