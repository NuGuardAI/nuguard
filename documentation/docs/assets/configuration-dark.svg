<svg width="920" height="560" viewBox="0 0 920 560" xmlns="http://www.w3.org/2000/svg" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="920" height="560" fill="#1a1a19"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#ffffff">Configuration reference — nuguard.yaml</text>
  <text x="24" y="52" font-size="11.5" fill="#c3c2b7">Scaffold with <tspan font-family="ui-monospace,Consolas,monospace" fill="#3987e5">nuguard init</tspan>, or start from <tspan font-family="ui-monospace,Consolas,monospace" fill="#3987e5">nuguard.yaml.example</tspan></text>
  <rect x="24" y="66" width="872" height="1" fill="#2c2c2a"/>

  <g font-size="11.5">
    <!-- sbom -->
    <text x="24" y="108" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">sbom</text>
    <text x="190" y="108" fill="#ffffff">Existing SBOM path</text>
    <rect x="24" y="122" width="872" height="1" fill="#2c2c2a"/>

    <!-- source -->
    <text x="24" y="144" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">source</text>
    <text x="190" y="144" fill="#ffffff">Source directory for generation</text>
    <rect x="24" y="158" width="872" height="1" fill="#2c2c2a"/>

    <!-- policy -->
    <text x="24" y="180" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">policy</text>
    <text x="190" y="180" fill="#ffffff">Cognitive policy path</text>
    <rect x="24" y="194" width="872" height="1" fill="#2c2c2a"/>

    <!-- target (2 lines) -->
    <text x="24" y="216" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">target</text>
    <text x="190" y="216" fill="#ffffff">Live app URL, endpoint path, request/response payload shape, and auth</text>
    <text x="190" y="234" fill="#ffffff">(bearer / API key / basic / login-flow) — shared by behavior and redteam, set once</text>
    <rect x="24" y="250" width="872" height="1" fill="#2c2c2a"/>

    <!-- llm -->
    <text x="24" y="272" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">llm</text>
    <text x="190" y="272" fill="#ffffff">Model settings for LLM-assisted features</text>
    <rect x="24" y="286" width="872" height="1" fill="#2c2c2a"/>

    <!-- sbom_generation -->
    <text x="24" y="308" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">sbom_generation</text>
    <text x="190" y="308" fill="#ffffff">Toggle LLM enrichment of SBOM nodes (llm: true), requires LITELLM_API_KEY</text>
    <rect x="24" y="322" width="872" height="1" fill="#2c2c2a"/>

    <!-- behavior -->
    <text x="24" y="344" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">behavior</text>
    <text x="190" y="344" fill="#ffffff">Target URL, endpoint, and test profile settings</text>
    <rect x="24" y="358" width="872" height="1" fill="#2c2c2a"/>

    <!-- redteam (2 lines) -->
    <text x="24" y="380" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">redteam</text>
    <text x="190" y="380" fill="#ffffff">Target URL, endpoint, canary file, profiles, scenario filters, guided</text>
    <text x="190" y="398" fill="#ffffff">conversation settings, and finding trigger controls (finding_triggers.*)</text>
    <rect x="24" y="414" width="872" height="1" fill="#2c2c2a"/>

    <!-- analyze -->
    <text x="24" y="436" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">analyze</text>
    <text x="190" y="436" fill="#ffffff">Minimum severity threshold</text>
    <rect x="24" y="450" width="872" height="1" fill="#2c2c2a"/>

    <!-- database -->
    <text x="24" y="472" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">database</text>
    <text x="190" y="472" fill="#ffffff">SQLite or Postgres-backed storage settings</text>
    <rect x="24" y="486" width="872" height="1" fill="#2c2c2a"/>

    <!-- output -->
    <text x="24" y="508" font-family="ui-monospace,Consolas,monospace" font-weight="600" fill="#3987e5">output</text>
    <text x="190" y="508" fill="#ffffff">Output format and failure threshold</text>
  </g>

  <text x="24" y="536" font-size="11" fill="#898781">Precedence: CLI flags → nuguard.yaml → environment variables → built-in defaults</text>
</svg>
