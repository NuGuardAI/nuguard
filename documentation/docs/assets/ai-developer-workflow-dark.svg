<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">NuGuard workflow for AI developers</title>
  <desc id="desc">The NuGuard lifecycle moves from Discover to Analyze, Validate, and Govern. A remediation loop returns findings to code updates in the Discover stage.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1224"/><stop offset="1" stop-color="#111827"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#020617" flood-opacity=".45"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#64748b"/></marker>
    <marker id="loop-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 10 5 0 10z" fill="#22c55e"/></marker>
    <style>
      .eyebrow{font:700 13px Inter,system-ui,sans-serif;letter-spacing:.11em;text-transform:uppercase;fill:#22c55e}
      .heading{font:700 24px Inter,system-ui,sans-serif;fill:#f8fafc}
      .title{font:700 20px Inter,system-ui,sans-serif;fill:#f8fafc}
      .body{font:400 15px Inter,system-ui,sans-serif;fill:#9ca3af}
      .pill{font:600 12px Inter,system-ui,sans-serif;fill:#86efac}
      .step{font:800 13px Inter,system-ui,sans-serif;fill:#0b1224}
    </style>
  </defs>
  <rect width="1200" height="430" rx="18" fill="url(#bg)"/>
  <circle cx="1130" cy="-30" r="210" fill="#22c55e" opacity=".06"/>
  <text x="48" y="46" class="eyebrow">Continuous AI security lifecycle</text>
  <text x="48" y="78" class="heading">Discover. Analyze. Validate. Govern.</text>

  <g filter="url(#shadow)">
    <rect x="48" y="116" width="218" height="184" rx="14" fill="#1e293b" stroke="#334155"/>
    <circle cx="78" cy="146" r="14" fill="#22c55e"/><text x="74" y="151" class="step">1</text>
    <text x="102" y="152" class="eyebrow">Discover</text>
    <text x="72" y="194" class="title">AI application</text>
    <text x="72" y="224" class="body">Code · config · IaC</text>
    <text x="72" y="250" class="body">Agents · models · tools</text>
    <rect x="72" y="270" width="116" height="25" rx="12" fill="#14532d"/><text x="86" y="287" class="pill">map AI assets</text>
  </g>
  <path d="M278 208h42" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="332" y="116" width="218" height="184" rx="14" fill="#1e293b" stroke="#334155"/>
    <circle cx="362" cy="146" r="14" fill="#22c55e"/><text x="358" y="151" class="step">2</text>
    <text x="386" y="152" class="eyebrow">Analyze</text>
    <text x="356" y="194" class="title">Risk &amp; attack paths</text>
    <text x="356" y="224" class="body">AI-SBOM · data flows</text>
    <text x="356" y="250" class="body">Static · supply chain</text>
    <rect x="356" y="270" width="116" height="25" rx="12" fill="#14532d"/><text x="370" y="287" class="pill">find exposure</text>
  </g>
  <path d="M562 208h42" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="616" y="116" width="244" height="184" rx="14" fill="#1e293b" stroke="#334155"/>
    <circle cx="646" cy="146" r="14" fill="#22c55e"/><text x="642" y="151" class="step">3</text>
    <text x="670" y="152" class="eyebrow">Validate</text>
    <text x="640" y="194" class="title">Controls &amp; behavior</text>
    <text x="640" y="224" class="body">Policy · behavior · red-team</text>
    <text x="640" y="250" class="body">Authorized web pentest</text>
    <rect x="640" y="270" width="121" height="25" rx="12" fill="#3f2b0d"/><text x="654" y="287" class="pill" style="fill:#fcd34d">prove controls</text>
  </g>
  <path d="M872 208h42" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="926" y="116" width="226" height="184" rx="14" fill="#162a22" stroke="#256d43"/>
    <circle cx="956" cy="146" r="14" fill="#22c55e"/><text x="952" y="151" class="step">4</text>
    <text x="980" y="152" class="eyebrow">Govern</text>
    <text x="950" y="194" class="title">Policy &amp; evidence</text>
    <text x="950" y="224" class="body">Reports · SARIF · CI gates</text>
    <text x="950" y="250" class="body">Risk posture · audit trail</text>
    <rect x="950" y="270" width="126" height="25" rx="12" fill="#14532d"/><text x="964" y="287" class="pill">manage posture</text>
  </g>

  <path d="M1039 314v68H157v-68" fill="none" stroke="#22c55e" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#loop-arrow)" opacity=".85"/>
  <rect x="474" y="350" width="252" height="40" rx="20" fill="#22c55e"/>
  <text x="506" y="375" class="step" style="font-size:14px">Remediate · update code</text>
</svg>
