<svg width="760" height="170" viewBox="0 0 760 170" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace">
  <rect width="760" height="170" rx="10" fill="#0d1117"/>
  <rect width="760" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="760" height="10" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>

  <g font-size="12.5">
    <text x="20" y="62" fill="#7ee787">$ <tspan fill="#c9d1d9">nuguard sbom generate --source . --output app.sbom.json</tspan></text>

    <text x="20" y="96" fill="#8b949e"># or scan a remote repository:</text>

    <text x="20" y="120" fill="#7ee787">$ <tspan fill="#c9d1d9">nuguard sbom generate \</tspan></text>
    <text x="38" y="140" fill="#c9d1d9">--from-repo https://github.com/org/repo --ref main \</text>
    <text x="38" y="160" fill="#c9d1d9">--output app.sbom.json</text>
  </g>
</svg>
