<svg width="1000" height="300" viewBox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace,'Cascadia Code','SF Mono',Consolas,monospace">
  <rect width="1000" height="300" rx="10" fill="#0d1117"/>

  <!-- title bar -->
  <rect width="1000" height="34" rx="10" fill="#161b22"/>
  <rect y="24" width="1000" height="10" fill="#161b22"/>
  <circle cx="22" cy="17" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="17" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="17" r="6" fill="#27c93f"/>
  <text x="500" y="21" font-size="12" fill="#8b949e" text-anchor="middle">nuguard --help</text>

  <text x="24" y="60" font-size="12.5" fill="#7ee787">$ <tspan fill="#c9d1d9">nuguard --help</tspan></text>

  <rect x="560" y="88" width="1" height="180" fill="#30363d"/>

  <g font-size="12.5">
    <!-- Core column -->
    <text x="24" y="90" fill="#8b949e">Core</text>

    <text x="24" y="112" fill="#58a6ff">init</text>
    <text x="110" y="112" fill="#c9d1d9">Scaffold a nuguard.yaml config file</text>

    <text x="24" y="134" fill="#58a6ff">sbom</text>
    <text x="110" y="134" fill="#c9d1d9">Generate, validate, and manage the AI-SBOM</text>

    <text x="24" y="156" fill="#58a6ff">analyze</text>
    <text x="110" y="156" fill="#c9d1d9">Static risk analysis, no running app required</text>

    <text x="24" y="178" fill="#58a6ff">policy</text>
    <text x="110" y="178" fill="#c9d1d9">Cognitive policy linting and compliance checks</text>

    <text x="24" y="200" fill="#58a6ff">behavior</text>
    <text x="110" y="200" fill="#c9d1d9">Analyze behavior against its declared intent</text>

    <text x="24" y="222" fill="#58a6ff">redteam</text>
    <text x="110" y="222" fill="#c9d1d9">Dynamic adversarial testing, live app</text>

    <text x="24" y="244" fill="#58a6ff">scan</text>
    <text x="110" y="244" fill="#c9d1d9">Unified pipeline: SBOM → analyze, +policy/redteam</text>

    <text x="24" y="266" fill="#58a6ff">target</text>
    <text x="110" y="266" fill="#c9d1d9">Connectivity and auth verification before a run</text>

    <!-- Supporting column -->
    <text x="590" y="90" fill="#8b949e">Supporting</text>

    <text x="590" y="112" fill="#58a6ff">seed</text>
    <text x="676" y="112" fill="#c9d1d9">Seed canary data before red-teaming</text>

    <text x="590" y="134" fill="#58a6ff">validate</text>
    <text x="676" y="134" fill="#c9d1d9">Validate AI application behaviour</text>

    <text x="590" y="156" fill="#58a6ff">report</text>
    <text x="676" y="156" fill="#c9d1d9">Reports for a completed red-team run</text>

    <text x="590" y="178" fill="#58a6ff">findings</text>
    <text x="676" y="178" fill="#c9d1d9">List findings from a completed run</text>

    <text x="590" y="200" fill="#58a6ff">replay</text>
    <text x="676" y="200" fill="#c9d1d9">Replay a completed red-team run</text>
  </g>
</svg>
