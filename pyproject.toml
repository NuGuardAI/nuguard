[project]
name = "nuguard"
version = "0.9.5"
description = "AI application security — SBOM generation, vulnerability scanning, behavioral validation, and adversarial red-teaming for AI Agents"
readme = ".github/README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
authors = [
    { name = "NuGuard", email = "info@nuguard.ai" },
]
keywords = ["ai", "security", "sbom", "red-team", "llm", "prompt-injection", "appsec", "agent"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0",
    "jsonschema>=4.23",
    "httpx>=0.27",
    "litellm>=1.83.10",
    "rich>=13.0",
    "structlog>=25.5.0",
    "cyclonedx-bom>=7.2.2",
    "tree-sitter>=0.23",
    "tree-sitter-javascript>=0.23",
    "tree-sitter-typescript>=0.23",
    "python-dotenv>=1.0",
    "pathspec>=0.12",
    "tree-sitter-go>=0.23",
]

[project.optional-dependencies]
dev = [
    "pip>=26.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]
mcp = [
    "mcp>=1.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
]
spdx = [
    "pyshacl>=0.25",
    "rdflib>=7.0",
]
secrets = [
    "cryptography>=42.0",
]
browser = [
    "playwright>=1.45",
    "ruamel.yaml>=0.18",
]

[project.urls]
Homepage = "https://github.com/NuGuardAI/nuguard"
Repository = "https://github.com/NuGuardAI/nuguard"
Issues = "https://github.com/NuGuardAI/nuguard/issues"

[project.scripts]
nuguard = "nuguard.cli.main:app"
nuguard-mcp = "nuguard.mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = [
    "/.claude",
    "/.mypy_cache",
    "/.pytest_cache",
    "/.ruff_cache",
    "/dist",
    "/tmp",
    "/tests",
    "/nuguard/**/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["nuguard"]

[tool.hatch.build.targets.sdist]
include = [
    "/nuguard",
    "/.github/README.md",
    "/pyproject.toml",
    "/Makefile",
    "/canary.example.json",
    "/nuguard.yaml.example",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib --ignore=tests/apps/contact-center-ai-samples --ignore=tests/apps/blissful-store --ignore=tests/apps/claude-cookbooks --ignore=tests/apps/ai-agents-google-adk/test_bedrock_haiku.py --ignore=tests/apps/ai-agents-google-adk/test_openai_gpt.py --ignore=tests/apps/pinnacle-bank-app/e2e_tests --ignore=tests/apps/ChapterApps"
testpaths = ["tests", "nuguard/sbom/tests"]
markers = [
    "redteam_e2e: E2E redteam scan against a live fixture app (opt-in: NUGUARD_REDTEAM_E2E=1)",
    "benchmark_redteam: Full benchmark redteam CLI scan (opt-in: NUGUARD_REDTEAM_BENCHMARK=1)",
    "analyze_e2e: E2E analyze pipeline from GitHub clone (opt-in: NUGUARD_ANALYZE_E2E=1)",
    "smoke: Smoke tests for key extraction scenarios",
    "redteam_judge_eval: Judge-accuracy corpus replay against a real LLM (opt-in, needs an LLM API key)",
]

[tool.ruff]
line-length = 100
exclude = [
    "nuguard/**/tests/fixtures",
    "tests",
    "tmp",
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_unused_ignores = false
exclude = [
    "nuguard/.*/tests/fixtures",
]

[dependency-groups]
dev = [
    "boto3>=1.42.91",
    "mcp>=1.0",
    "mypy>=1.19.1",
    "pre-commit>=4.0.0",
    "pip-audit>=2.10.0",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.15.7",
    "types-pyyaml>=6.0.12.20250915",
]
