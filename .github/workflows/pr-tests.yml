name: PR Tests

on:
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pr-tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  release-contract:
    name: Release metadata contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Verify release metadata
        run: |
          uv lock --check
          npm run version:check
          uv run pytest tests/test_release_metadata.py -q

  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Run lint and type checks
        run: |
          uv run ruff check nuguard/
          uv run mypy nuguard/
          uv run deptry nuguard/

  clean-install:
    name: Clean-install smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Build wheel
        run: uv build --wheel --out-dir "$RUNNER_TEMP/dist"

      # Install only the wheel's core dependencies, with no extras, to catch
      # runtime imports that are missing from the declared dependencies.
      - name: Install wheel into a clean environment
        run: |
          uv venv --python 3.12 "$RUNNER_TEMP/clean-venv"
          uv pip install --python "$RUNNER_TEMP/clean-venv/bin/python" "$RUNNER_TEMP"/dist/*.whl

      # Run from outside the checkout so the source tree cannot shadow the installed package.
      - name: Check CLI and module imports
        working-directory: ${{ runner.temp }}
        run: |
          "$RUNNER_TEMP/clean-venv/bin/nuguard" --help
          "$RUNNER_TEMP/clean-venv/bin/python" "$GITHUB_WORKSPACE/scripts/check_clean_install.py"

  public-api-contract:
    name: Public API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - lint
      - browser_login

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev

      - name: Verify public API schema contract
        run: uv run pytest tests/contracts/test_public_api_schema_contract.py -q

  browser_login:
    name: Browser-login tests (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install browser test dependencies
        run: uv sync --dev --extra mcp --extra browser

      - name: Install Chromium
        run: uv run playwright install --with-deps chromium

      - name: Verify Chromium runtime
        env:
          NUGUARD_REQUIRE_BROWSER_TESTS: "1"
        run: uv run pytest tests/common/test_browser_runtime.py -q

      - name: Run browser-login tests
        run: |
          uv run pytest \
            tests/cli \
            tests/common \
            nuguard/common/browser_login \
            --ignore=tests/common/test_browser_runtime.py \
            -k "browser or discover" \
            -q \
            -ra

  package-tests:
    name: Package tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra mcp

      # Semgrep is an optional runtime scanner dependency, but Go rule-behaviour
      # tests need the executable. Pin the version used for local validation so
      # CI does not silently drift onto an incompatible Semgrep release.
      - name: Install Semgrep for rule-behaviour tests
        run: uv pip install "semgrep==1.172.0"

      - name: Run package unit tests
        run: uv run pytest nuguard/ -q

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev --extra mcp

      # Preserve the environment used by the former serial full-suite job.
      - name: Install Semgrep for rule-behaviour tests
        run: uv pip install "semgrep==1.172.0"

      - name: Run integration tests
        run: uv run pytest tests/ --ignore=tests/apps/contact-center-ai-samples -v

  test:
    name: Run full pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - lint
      - public-api-contract
      - browser_login
      - release-contract
      - clean-install
      - package-tests
      - integration-tests

    steps:
      - name: Verify every required gate passed
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          PUBLIC_API_RESULT: ${{ needs['public-api-contract'].result }}
          BROWSER_RESULT: ${{ needs.browser_login.result }}
          RELEASE_RESULT: ${{ needs.release-contract.result }}
          CLEAN_INSTALL_RESULT: ${{ needs['clean-install'].result }}
          PACKAGE_RESULT: ${{ needs['package-tests'].result }}
          INTEGRATION_RESULT: ${{ needs['integration-tests'].result }}
        run: |
          for result in \
            "$LINT_RESULT" \
            "$PUBLIC_API_RESULT" \
            "$BROWSER_RESULT" \
            "$RELEASE_RESULT" \
            "$CLEAN_INSTALL_RESULT" \
            "$PACKAGE_RESULT" \
            "$INTEGRATION_RESULT"; do
            if [ "$result" != "success" ]; then
              echo "Required CI gate did not pass: $result"
              exit 1
            fi
          done
