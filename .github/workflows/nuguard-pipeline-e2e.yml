name: NuGuard Pipeline E2E

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuguard-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Develop-branch PRs: fast one-app regression check (sbom -> behavior -> redteam)
  # against the openai-cs-agents-demo target. A failure blocks the PR from merging.
  develop-e2e:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'develop'
    name: develop-e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_API_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      - name: Run prepublish sanity suite (openai-cs only)
        run: ./tests/apps/prepublish-sanity.sh openai-cs

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuguard-e2e-develop-openai-cs
          path: tests/apps/openai-cs-agents-demo/reports/**
          if-no-files-found: ignore

  # Main-branch PRs: full 3-app suite (sbom -> behavior -> redteam), one app per
  # matrix leg so failures are isolated and legs run in parallel. Publication off
  # main should only proceed once all three legs pass.
  main-e2e:
    if: github.event_name == 'workflow_dispatch' || github.base_ref == 'main'
    name: main-e2e (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        app:
          - openai-cs
          - gemini-auto
          - pinnacle-bank

    env:
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_API_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv sync --dev

      - name: Run prepublish sanity suite (${{ matrix.app }})
        run: ./tests/apps/prepublish-sanity.sh ${{ matrix.app }}

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuguard-e2e-main-${{ matrix.app }}
          path: tests/apps/**/reports/**
          if-no-files-found: ignore
