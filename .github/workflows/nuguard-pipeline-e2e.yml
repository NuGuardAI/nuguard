name: NuGuard Pipeline E2E

on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nuguard-e2e-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  # Single 3-app matrix runs for both develop and main PRs. Artifact names are
  # prefixed with the base branch so reports from each target remain distinguishable.
  e2e:
    name: e2e (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: e2e
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: openai-cs
            report_dir: tests/apps/openai-cs-agents-demo/reports
          - app: gemini-auto
            report_dir: tests/apps/Gemini-Auto-app/reports
          - app: pinnacle-bank
            report_dir: tests/apps/pinnacle-bank-app/reports
          - app: customer-support
            report_dir: tests/apps/java/customer-support-agent-example/reports
          - app: go-support
            report_dir: tests/apps/go/eino-support-copilot/reports
          - app: csharp-banking
            report_dir: tests/apps/csharp/banking-multi-agent-copilot/reports

    env:
      AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
      AZURE_API_BASE: ${{ secrets.AZURE_API_BASE }}
      AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_API_BASE }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@e58605a9b6da7c637471fab8847a5e5a6b8df081 # v5
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --dev

      # --- customer-support only: the target is a local Java app started inside the job ---
      - name: Set up Java (customer-support)
        if: matrix.app == 'customer-support'
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: tests/apps/java/customer-support-agent-example/pom.xml

      - name: Start the Java target app and shim (customer-support)
        if: matrix.app == 'customer-support'
        run: tests/apps/java/customer-support-agent-example/scripts/serve.sh

      - name: Set up Go (go-support)
        if: matrix.app == 'go-support'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: tests/apps/go/eino-support-copilot/go.mod
          cache-dependency-path: tests/apps/go/eino-support-copilot/go.sum

      - name: Start the Go target app (go-support)
        if: matrix.app == 'go-support'
        run: tests/apps/go/eino-support-copilot/scripts/serve.sh

      # --- csharp-banking only: the target is a local ASP.NET Core app started inside the job ---
      - name: Set up .NET (csharp-banking)
        if: matrix.app == 'csharp-banking'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: "9.0.x"

      - name: Start the C# target app (csharp-banking)
        if: matrix.app == 'csharp-banking'
        run: tests/apps/csharp/banking-multi-agent-copilot/scripts/serve.sh

      - name: Run prepublish sanity suite (${{ matrix.app }})
        run: bash tests/apps/prepublish-sanity.sh ${{ matrix.app }}

      - name: Check the generated SBOM against EXPECTED_SBOM.md (go-support)
        if: matrix.app == 'go-support'
        run: |
          APP=tests/apps/go/eino-support-copilot
          uv run python $APP/scripts/check_sbom.py $APP/eino-support-copilot.sbom.json

      - name: Install Semgrep (customer-support, go-support, csharp-banking)
        if: matrix.app == 'customer-support' || matrix.app == 'go-support' || matrix.app == 'csharp-banking'
        run: |
          uv tool install semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run analyze on the generated SBOM (customer-support)
        if: matrix.app == 'customer-support'
        run: |
          set +e
          APP=tests/apps/java/customer-support-agent-example
          uv run nuguard analyze --sbom $APP/customer-support-agent.sbom.json --source $APP \
            --no-grype --no-trivy --no-checkov --format markdown --output $APP/reports/analyze.md
          rc=$?
          echo "analyze exit code: $rc (0 = no findings, 1 = findings reported, 2 = analysis error)"
          [ "$rc" -le 1 ]

      - name: Run analyze on the generated SBOM (go-support)
        if: matrix.app == 'go-support'
        run: |
          set +e
          APP=tests/apps/go/eino-support-copilot
          uv run nuguard analyze --sbom $APP/eino-support-copilot.sbom.json --source $APP \
            --no-grype --no-trivy --no-checkov --format markdown --output $APP/reports/analyze.md
          rc=$?
          echo "analyze exit code: $rc (0 = no findings, 1 = findings reported, 2 = analysis error)"
          [ "$rc" -le 1 ]

      - name: Run analyze on the generated SBOM (csharp-banking)
        if: matrix.app == 'csharp-banking'
        run: |
          set +e
          APP=tests/apps/csharp/banking-multi-agent-copilot
          uv run nuguard analyze --sbom $APP/banking-multi-agent-copilot.sbom.json --source $APP \
            --no-grype --no-trivy --no-checkov --format markdown --output $APP/reports/analyze.md
          rc=$?
          echo "analyze exit code: $rc (0 = no findings, 1 = findings reported, 2 = analysis error)"
          [ "$rc" -le 1 ]

      - name: Stop the Go target app (go-support)
        if: always() && matrix.app == 'go-support'
        run: tests/apps/go/eino-support-copilot/scripts/stop.sh

      - name: Stop the C# target app (csharp-banking)
        if: always() && matrix.app == 'csharp-banking'
        run: tests/apps/csharp/banking-multi-agent-copilot/scripts/stop.sh

      - name: Stop the Java target app and shim (customer-support)
        if: always() && matrix.app == 'customer-support'
        run: tests/apps/java/customer-support-agent-example/scripts/stop.sh

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nuguard-e2e-${{ github.base_ref }}-${{ matrix.app }}
          path: ${{ matrix.report_dir }}/**
          if-no-files-found: ignore
