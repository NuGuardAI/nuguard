# NuGuard configuration for SasanLabs/OWASP VulnerableApp.
#
# VulnerableApp is a deliberately vulnerable web application, not an AI/chat
# application. Use `nuguard analyze` for source analysis and `nuguard pentest`
# for the deployed target. Its application shell and scanner APIs are public;
# username/password forms are individual vulnerability exercises, not a
# site-wide login.

source: https://github.com/SasanLabs/VulnerableApp
ref: master
sbom: tests/apps/owasp-vulnerableapp/vulnerableapp.sbom.json

sbom_generation:
  llm: false

# Pentest remediation and executive-summary generation use the shared,
# top-level LLM configuration. Keep this explicit so the test workflow does
# not fall back to NuGuard's built-in model default.
llm:
  model: azure/${AZURE_DEEPSEEK_MODEL_NAME}    # any LiteLLM model string (openai/gpt-4o, etc.)
  api_key: ${AZURE_DEEPSEEK_KEY}     # never put keys here; use env var interpolation
  api_base: ${AZURE_DEEPSEEK_ENDPOINT}     # optional override for Azure OpenAI endpoint URL

target:
  # url: http://vulnerableapp-demo.eastus2.azurecontainer.io:9090/VulnerableApp
  # url: http://127.0.0.1:9090/VulnerableApp
  url: http://localhost:9090/VulnerableApp
  auth:
    type: none

pentest:
  profile: standard
  use_sbom_endpoints: true
  use_bundled_templates: true
  use_live_openapi: true
  verify_auth: false
  rate_limit: 10
  concurrency: 5
  retries: 1
  request_timeout: 30
  scan_timeout: 1800
  fail_on: high

analyze:
  min_severity: medium

output:
  format: markdown
  fail_on: high
