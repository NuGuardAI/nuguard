id: juiceshop-search-sqli

info:
  name: OWASP Juice Shop - Error-Based SQL Injection in Product Search
  author: security-tester
  severity: high
  description: >
    The product search endpoint concatenates the 'q' query parameter directly
    into a SQL query without escaping. A single unescaped quote triggers a
    raw SQLite syntax error in the response, confirming the query string is
    injectable (classic error-based SQL injection entry point).
  tags: juiceshop, sqli, injection

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/products/search?q=apple'"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 500

      - type: word
        words:
          - "SQLITE_ERROR"
          - "syntax error"
        condition: and
