id: juiceshop-exposed-admin-config

info:
  name: OWASP Juice Shop - Unauthenticated Admin Configuration Disclosure
  author: security-tester
  severity: medium
  description: >
    The admin application-configuration endpoint returns the full server-side
    configuration (backend paths, feature flags, theming/branding, and other
    internal settings) to unauthenticated requests, with no admin-role check
    enforced.
  tags: juiceshop, exposure, broken-access-control

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/admin/application-configuration"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - '"config"'
          - '"application"'
        condition: and
