id: juiceshop-scoreboard-detection

info:
  name: OWASP Juice Shop Score Board Detection
  author: local-security-tester
  severity: low
  description: Detects if the Juice Shop application is running and its scoreboard endpoint is exposed.
  tags: juiceshop, exposure, recon

http:
  - method: GET
    path:
      - "{{BaseURL}}/rest/continue-code"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "orange-juice"
          - "continueCode"
        case-insensitive: true
        condition: or
