id: juiceshop-exposed-directories

info:
  name: OWASP Juice Shop - Sensitive Directory Listing Exposed
  author: security-tester
  severity: medium
  description: >
    Several backend directories that should require authentication or be
    unreachable entirely (FTP-style backup drop, encryption key storage,
    support log archive) instead return a public directory listing to any
    unauthenticated request, disclosing filenames that are themselves often
    sensitive (e.g. legacy backups, key material, access logs).
  tags: juiceshop, exposure, misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/ftp"
      - "{{BaseURL}}/encryptionkeys"
      - "{{BaseURL}}/support/logs"

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 200

      - type: word
        part: body
        words:
          - "listing directory"
