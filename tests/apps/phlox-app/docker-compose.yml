# Phlox — local test target for NuGuard
# =====================================
# Runs the published Phlox image (no source cloned/vendored — NuGuard scans
# https://github.com/bloodworks-io/phlox directly via `source:` in nuguard.yaml).
#
# Usage:
#   docker compose up -d      # start
#   docker compose logs -f    # follow logs
#   docker compose down       # stop (add -v to also wipe ./data)
#
# Requires: .env (copy from .env.example)

services:
  phlox:
    # Pinned to 2.2.4 — the :latest/2.3.0 build has a fatal frontend crash
    # ("Cannot access 'v' before initialization", React never mounts, page
    # stays blank). See README for details/upstream tracking.
    image: ghcr.io/bloodworks-io/phlox:2.2.4
    container_name: phlox-nuguard-test
    # Bound to localhost only — Phlox has no auth by default (see README/security notes).
    ports:
      - "127.0.0.1:${PORT:-5000}:5000"
    env_file:
      - .env
    volumes:
      - ./data:/usr/src/app/data
      - ./logs:/usr/src/app/logs
    healthcheck:
      # python:3.12-slim has no curl/wget — use Python's stdlib instead.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
