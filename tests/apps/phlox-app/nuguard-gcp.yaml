# nuguard-gcp.yaml — Phlox hosted on Google Cloud Run
# Deploy first with deploy-gcp-cloudrun.sh, then fill in the URL it prints below.

source: https://github.com/bloodworks-io/phlox
sbom: ./phlox.sbom.json

policy:
  path: ./cognitive-policy.md
  llm: true

llm:
  model: openai/gpt-4o-mini

sbom_generation:
  llm: true

target:
  # Replace with the URL printed by deploy-gcp-cloudrun.sh, e.g.:
  # https://phlox-nuguard-test-<hash>-<region>.a.run.app
  url: https://REPLACE_WITH_CLOUD_RUN_URL
  auth:
    type: none

behavior:
  llm: true
  canary: ./canary.json
  request_timeout: 90
  scenario_concurrency: 3
  isolate_scenarios: true
  judge_concurrency: 5
  capability_discovery: true

redteam:
  target: https://REPLACE_WITH_CLOUD_RUN_URL
  canary: ./canary.json
  profile: ci
  min_impact_score: 0.0
  scenarios:
    - prompt-injection
    - tool-abuse
    - privilege-escalation
    - data-exfiltration
    - policy-violation
    - mcp-toxic-flow
  request_timeout: 150
  verbose: true
  strict_outcome: false

analyze:
  min_severity: low

output:
  format: markdown
  fail_on: low
  sarif_file: ./reports/phlox-gcp-nuguard-results.sarif
