# nuguard-azure.yaml — Phlox hosted on Azure Container Instances
# Deploy first with deploy-azure-aci.sh, then fill in the FQDN it prints below.

source: https://github.com/bloodworks-io/phlox
sbom: ./phlox.sbom.json

policy:
  path: ./cognitive-policy.md
  llm: true

llm:
  model: openai/gpt-4o-mini
  api_key: ${OPENAI_API_KEY}
  # Pin explicitly — .env also sets AZURE_API_BASE (for the Azure-flavored
  # nuguard.yaml in this same directory), which litellm_api_base aliases to
  # when unset, silently redirecting this plain-OpenAI model to the Azure
  # endpoint and causing litellm.NotFoundError ("Resource not found").
  api_base: https://api.openai.com/v1

sbom_generation:
  llm: true

target:
  url: http://phlox-nuguard-d35b6449.eastus2.azurecontainer.io:80
  auth:
    type: none

behavior:
  llm: true
  canary: ./canary.json
  request_timeout: 90
  scenario_concurrency: 3
  isolate_scenarios: true
  judge_concurrency: 5
  capability_discovery: true

redteam:
  target: http://phlox-nuguard-d35b6449.eastus2.azurecontainer.io:80
  canary: ./canary.json
  profile: ci
  min_impact_score: 0.0
  scenarios:
    - prompt-injection
    - tool-abuse
    - privilege-escalation
    - data-exfiltration
    - policy-violation
    - mcp-toxic-flow
  request_timeout: 150
  verbose: true
  strict_outcome: false

analyze:
  min_severity: low

output:
  format: markdown
  fail_on: low
  sarif_file: ./reports/phlox-azure-nuguard-results.sarif
