id: juiceshop-open-redirect

info:
  name: OWASP Juice Shop - Open Redirect via Allowlist Bypass
  author: security-tester
  severity: medium
  description: >
    The /redirect endpoint validates the 'to' parameter against an allowlist
    of trusted URL prefixes, but the check is a naive startswith/substring
    match. Encoding a path separator (%2f) before an '@' lets an attacker
    smuggle an allowlisted URL as HTTP userinfo, so the browser navigates to
    an attacker-controlled host that follows the '@' while the allowlist
    check still matches the beginning of the string.
  tags: juiceshop, redirect, misconfig

http:
  - method: GET
    path:
      - "{{BaseURL}}/redirect?to=https://github.com/juice-shop/juice-shop%2f@evil.example.com"

    headers:
      Accept: text/html

    matchers-condition: and
    matchers:
      - type: status
        status:
          - 302

      - type: word
        part: header
        words:
          - "evil.example.com"
