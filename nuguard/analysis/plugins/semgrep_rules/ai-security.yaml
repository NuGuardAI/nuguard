    message: >
      AI/LLM request uses an unbounded root context (context.Background or
      context.TODO) with no timeout or deadline. Unbounded LLM calls can hang
      indefinitely and enable denial-of-service. Wrap the context with
      context.WithTimeout or context.WithDeadline before calling the LLM API.
    languages: [go]
    severity: WARNING
    metadata:
      category: security
      technology: [go, llm]
      owasp: "LLM04: Model Denial of Service"

  - id: nuguard-go-llm-insecure-tls
    # Match both value-form constructors (e.g. go-openai NewClientWithConfig(cfg))
    # and pointer-deref forms (NewClientWithConfig(*cfg)) used by some providers.
    # Passing a pointer config variable without dereference is covered by $CFG.
    pattern-either:
      - patterns:
          - pattern: |
              func $FN(...) {
                ...
                $TRANSPORT := &http.Transport{
                  TLSClientConfig: &tls.Config{
                    InsecureSkipVerify: true,
                  },
                }
                ...
                $HTTP := &http.Client{
                  Transport: $TRANSPORT,
                }
                ...
                $CFG.HTTPClient = $HTTP
                ...
                $CLIENT := $NEW(..., $CFG, ...)
                ...
                $CLIENT.$METHOD($CTX, $REQ)
                ...
              }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
      - patterns:
          - pattern: |
              func $FN(...) {
                ...
                $TRANSPORT := &http.Transport{
                  TLSClientConfig: &tls.Config{
                    InsecureSkipVerify: true,
                  },
                }
                ...
                $HTTP := &http.Client{
                  Transport: $TRANSPORT,
                }
                ...
                $CFG.HTTPClient = $HTTP
                ...
                $CLIENT := $NEW(..., *$CFG, ...)
                ...
                $CLIENT.$METHOD($CTX, $REQ)
                ...
              }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
      - patterns:
          - pattern: |
              func $FN(...) {
                ...
                $CFG.HTTPClient = &http.Client{
                  Transport: &http.Transport{
                    TLSClientConfig: &tls.Config{
                      InsecureSkipVerify: true,
                    },
                  },
                }
                ...
                $CLIENT := $NEW(..., $CFG, ...)
                ...
                $CLIENT.$METHOD($CTX, $REQ)
                ...
              }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
      - patterns:
          - pattern: |
              func $FN(...) {
                ...
                $CFG.HTTPClient = &http.Client{
                  Transport: &http.Transport{
                    TLSClientConfig: &tls.Config{
                      InsecureSkipVerify: true,
                    },
                  },
                }
                ...
                $CLIENT := $NEW(..., *$CFG, ...)
                ...
                $CLIENT.$METHOD($CTX, $REQ)
                ...
              }
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
      # option.WithHTTPClient flows (#232) — insecure transport wired directly
      # into the official SDK client constructor via client options. The sink
      # call is matched separately so qualified receivers (e.g.
      # client.Models.GenerateContent) still bind.
      - patterns:
          - pattern: |
              func $FN(...) {
                ...
                $TRANSPORT := &http.Transport{
                  TLSClientConfig: &tls.Config{
                    InsecureSkipVerify: true,
                  },
                }
                ...
                $HTTP := &http.Client{
                  Transport: $TRANSPORT,
                }
                ...
                $CLIENT := $NEW(..., option.WithHTTPClient($HTTP), ...)
                ...
              }
          - pattern-either:
              - pattern: $SINK.$METHOD($CTX, ...)
              - pattern: $SINK.Models.$METHOD($CTX, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
      - patterns:
          - pattern: |
              func $FN(...) {
                ...
                $CLIENT := $NEW(..., option.WithHTTPClient(&http.Client{
                  Transport: &http.Transport{
                    TLSClientConfig: &tls.Config{
                      InsecureSkipVerify: true,
                    },
                  },
                }), ...)
                ...
              }
          - pattern-either:
              - pattern: $SINK.$METHOD($CTX, ...)
              - pattern: $SINK.Models.$METHOD($CTX, ...)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
    message: >
      HTTP client TLS configuration disables certificate verification
      (InsecureSkipVerify: true) on an HTTP client assigned to a config that is
      then used to construct the AI/LLM client for an API call. This enables
      man-in-the-middle attacks against LLM API traffic. Use the default TLS
      settings or pin trusted certificates.
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      technology: [go, llm, tls]
      owasp: "A02: Cryptographic Failures"
