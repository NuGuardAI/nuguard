rules:
  # -------------------------------------------------------------------------
  # NuGuard AI Security Semgrep Rules
  # Detects common AI/LLM application security anti-patterns in Python and Go.
  # -------------------------------------------------------------------------

  - id: nuguard-llm-prompt-injection-fstring
    patterns:
      - pattern: |
          $LLM.chat(..., messages=[..., {"role": "user", "content": f"...{$INPUT}..."}], ...)
      - pattern-not: |
          $LLM.chat(..., messages=[..., {"role": "user", "content": f"...{$INPUT}..."}], ...)
          # allow if input is validated above — but we flag the raw pattern
    message: >
      Potential prompt injection: user-controlled input ($INPUT) is interpolated
      directly into an LLM prompt via an f-string. Validate and sanitize $INPUT
      before including it in prompts, or use a parameterised template approach.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      technology: [llm, openai, langchain]
      owasp: "LLM01: Prompt Injection"
      nuguard_rule: NGA-002

  - id: nuguard-llm-direct-user-input
    pattern: |
      $CLIENT.chat.completions.create(..., messages=[{"role": "user", "content": $REQUEST.$BODY}], ...)
    message: >
      Raw request body ($REQUEST.$BODY) is passed directly to the LLM without
      sanitization. An attacker may inject instructions that override system
      prompts or leak sensitive data. Sanitize or validate the content first.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      technology: [openai, llm]
      owasp: "LLM01: Prompt Injection"
      nuguard_rule: NGA-002

  - id: nuguard-hardcoded-api-key
    patterns:
      - pattern: $KEY = "sk-..."
      - pattern: $KEY = "AIza..."
      - pattern: $KEY = "ghp_..."
      - pattern: openai.api_key = "sk-..."
    message: >
      Hardcoded API key detected. Store secrets in environment variables or a
      secrets manager (e.g. AWS Secrets Manager, HashiCorp Vault). Never commit
      API keys to source control.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      technology: [openai, llm]
      owasp: "A02: Cryptographic Failures"
      nuguard_rule: NGA-003

  - id: nuguard-openai-key-in-code
    patterns:
      - pattern: |
          openai.api_key = $LITERAL
      - pattern-not: |
          openai.api_key = os.environ[...]
      - pattern-not: |
          openai.api_key = os.getenv(...)
    message: >
      OpenAI API key set to a literal value rather than an environment variable.
      Use `os.environ["OPENAI_API_KEY"]` or a secrets manager.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      technology: [openai]
      owasp: "A02: Cryptographic Failures"
      nuguard_rule: NGA-003

  - id: nuguard-eval-on-llm-output
    patterns:
      - pattern: eval($LLM_OUTPUT)
      - pattern: exec($LLM_OUTPUT)
    message: >
      Executing LLM output directly via eval/exec is extremely dangerous. An
      attacker who controls the prompt can inject arbitrary Python code.
      Never execute LLM output without strict validation.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      technology: [llm, python]
      owasp: "LLM02: Insecure Output Handling"
      nuguard_rule: NGA-002

  - id: nuguard-sql-injection-via-llm
    patterns:
      - pattern: $CURSOR.execute($LLM_CONTENT)
      - pattern: $CURSOR.execute(f"...{$LLM}...")
    message: >
      Database query assembled from LLM output without parameterisation. If the
      LLM response contains SQL, an attacker can perform SQL injection by
      controlling the prompt. Use parameterised queries.
    languages: [python]
    severity: ERROR
    metadata:
      category: security
      technology: [llm, sql]
      owasp: "LLM02: Insecure Output Handling"
      nuguard_rule: NGA-002

  - id: nuguard-llm-ssrf-requests
    patterns:
      - pattern: requests.get($LLM_URL)
      - pattern: requests.post($LLM_URL)
      - pattern: httpx.get($LLM_URL)
    message: >
      URL derived from LLM output is used directly in an HTTP request. This
      enables SSRF attacks — an attacker can make the server fetch internal
      resources. Validate and allowlist URLs before fetching.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      technology: [llm, ssrf]
      owasp: "LLM02: Insecure Output Handling"
      nuguard_rule: NGA-006

  - id: nuguard-no-output-length-limit
    patterns:
      - pattern: $CLIENT.chat.completions.create(...)
      - pattern-not: $CLIENT.chat.completions.create(..., max_tokens=..., ...)
    message: >
      LLM call without `max_tokens` limit. Unlimited token generation can lead
      to denial-of-service via excessive API costs or latency. Always specify
      `max_tokens`.
    languages: [python]
    severity: INFO
    metadata:
      category: security
      technology: [openai, llm]
      owasp: "LLM04: Model Denial of Service"
      nuguard_rule: NGA-015

  - id: nuguard-langchain-verbose-true
    pattern: |
      $CHAIN = $TYPE(..., verbose=True, ...)
    message: >
      LangChain chain created with `verbose=True`. In production this can leak
      intermediate prompts, tool calls, and retrieved documents to application
      logs. Set `verbose=False` in production deployments.
    languages: [python]
    severity: INFO
    metadata:
      category: security
      technology: [langchain]
      owasp: "LLM06: Sensitive Information Disclosure"
      nuguard_rule: NGA-009

  - id: nuguard-pickle-model-load
    patterns:
      - pattern: pickle.load($FILE)
      - pattern: torch.load($FILE)
      - pattern: joblib.load($FILE)
    message: >
      Loading a model with pickle/torch.load/joblib.load from an untrusted
      source can execute arbitrary code. Verify model integrity (e.g. checksum
      or signed manifest) before loading, and only load from trusted sources.
    languages: [python]
    severity: WARNING
    metadata:
      category: security
      technology: [ml, pytorch, scikit-learn]
      owasp: "A08: Software and Data Integrity Failures"
      nuguard_rule: NGA-008

  # -------------------------------------------------------------------------
  # Go AI/LLM security rules (issues #180 / #223)
  # #223 adds qualified official non-streaming SDK sinks; TLS / credential
  # option flows remain unchanged (WithHTTPClient follow-up).
  # #232 extends coverage to official streaming call shapes, credential
  # options (option.WithAPIKey and friends), and insecure-TLS flows wired
  # through option.WithHTTPClient.
  # -------------------------------------------------------------------------

  - id: nuguard-go-llm-prompt-injection-sprintf
    mode: taint
    # Issue #180 scope: untrusted string input must flow through fmt.Sprintf
    # before reaching an LLM sink. USER-labeled sources alone are not enough;
    # sinks require the FORMATTED label produced only by sprintf propagators.
    # Trusted literals/constants/config fields are not USER sources, so
    # trusted fmt.Sprintf -> LLM is not reported. Direct string-param -> LLM
    # (no sprintf) keeps only USER and therefore does not match.
    # Issue #223: qualified official sinks (never bare New); Bedrock uses
    # Converse/InvokeModel with optional trailing optFns (...).
    pattern-sources:
      - label: USER
        patterns:
          - pattern: |
              func $FN(..., $INPUT string, ...) {
                ...
              }
          - focus-metavariable: $INPUT
    pattern-propagators:
      - pattern: $TO = fmt.Sprintf(..., $FROM, ...)
        from: $FROM
        to: $TO
        label: FORMATTED
        requires: USER
      - pattern: $TO := fmt.Sprintf(..., $FROM, ...)
        from: $FROM
        to: $TO
        label: FORMATTED
        requires: USER
      - pattern: fmt.Sprintf(..., $FROM, ...)
        from: $FROM
        to: $FROM
        label: FORMATTED
        requires: USER
        by-side-effect: false
    pattern-sinks:
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.$METHOD($CTX, $REQ)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.Responses.New($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.Messages.New($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.Converse($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.InvokeModel($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.Models.GenerateContent($CTX, $MODEL, $CONTENTS, $CONFIG, ...)
      # Official streaming variants (#232)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.Chat.Completions.NewStreaming($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.Responses.NewStreaming($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.Messages.NewStreaming($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.ConverseStream($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.InvokeModelWithResponseStream($CTX, $REQ, ...)
      - requires: FORMATTED
        patterns:
          - pattern: $CLIENT.Models.GenerateContentStream($CTX, $MODEL, $CONTENTS, $CONFIG, ...)
    message: >
      Potential prompt injection: untrusted string input is interpolated into an
      LLM prompt via fmt.Sprintf and passed to an AI/LLM API call. Validate and
      sanitize untrusted input before including it in prompts, or use a
      parameterised template approach.
    languages: [go]
    severity: WARNING
    metadata:
      category: security
      technology: [go, llm]
      owasp: "LLM01: Prompt Injection"
      nuguard_rule: NGA-002

  - id: nuguard-go-hardcoded-api-key
    pattern-either:
      - patterns:
          - pattern: openai.DefaultConfig($KEY)
          - metavariable-regex:
              metavariable: $KEY
              regex: '"(sk-|AIza)'
      - patterns:
          - pattern: $CFG.AuthToken = $KEY
          - metavariable-regex:
              metavariable: $KEY
              regex: '"(sk-|AIza)'
          - pattern-not: $CFG.AuthToken = os.Getenv(...)
      - patterns:
          - pattern: $CFG.APIKey = $KEY
          - metavariable-regex:
              metavariable: $KEY
              regex: '"(sk-|AIza)'
          - pattern-not: $CFG.APIKey = os.Getenv(...)
      - patterns:
          - pattern: $CFG.ApiKey = $KEY
          - metavariable-regex:
              metavariable: $KEY
              regex: '"(sk-|AIza)'
          - pattern-not: $CFG.ApiKey = os.Getenv(...)
      # Official SDK credential options (#232) — option.WithAPIKey("sk-…") etc.
      - patterns:
          - pattern-either:
              - pattern: option.WithAPIKey($KEY)
              - pattern: option.WithToken($KEY)
              - pattern: option.WithAuthToken($KEY)
          - metavariable-regex:
              metavariable: $KEY
              regex: '"(sk-|AIza)'
    message: >
      Hardcoded AI service API key or auth token detected. Store secrets in
      environment variables or a secrets manager. Never commit API keys to
      source control.
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      technology: [go, llm]
      owasp: "A02: Cryptographic Failures"
      nuguard_rule: NGA-003

  - id: nuguard-go-llm-missing-context-timeout
    pattern-either:
      - patterns:
          - pattern: $CLIENT.$METHOD(context.Background(), $REQ)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
      - patterns:
          - pattern: $CLIENT.$METHOD(context.TODO(), $REQ)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
      - patterns:
          - pattern: |
              $CTX := context.Background()
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
      - patterns:
          - pattern: |
              $CTX := context.TODO()
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
          - pattern-not: |
              $CTX := context.TODO()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX := context.TODO()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX := context.TODO()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX := context.TODO()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
      - patterns:
          - pattern: |
              $CTX = context.Background()
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
          - pattern-not: |
              $CTX = context.Background()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX = context.Background()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX = context.Background()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX = context.Background()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
      - patterns:
          - pattern: |
              $CTX = context.TODO()
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - metavariable-regex:
              metavariable: $METHOD
              regex: ^(CreateChatCompletion|CreateCompletion|CreateChatCompletionStream|ConverseStream|InvokeModelWithResponseStream|GenerateContent|GenerateContentStream|CreateMessage|SendMessage|GenerateText)$
          - pattern-not: |
              $CTX = context.TODO()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX = context.TODO()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX = context.TODO()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
          - pattern-not: |
              $CTX = context.TODO()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.$METHOD($CTX, $REQ)
      - patterns:
          - pattern: $CLIENT.Chat.Completions.New(context.Background(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.Responses.New(context.Background(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.Messages.New(context.Background(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.Converse(context.Background(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.InvokeModel(context.Background(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.Models.GenerateContent(context.Background(), $MODEL, $CONTENTS, $CONFIG, ...)
      - patterns:
          - pattern: $CLIENT.Chat.Completions.New(context.TODO(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.Responses.New(context.TODO(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.Messages.New(context.TODO(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.Converse(context.TODO(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.InvokeModel(context.TODO(), $REQ, ...)
      - patterns:
          - pattern: $CLIENT.Models.GenerateContent(context.TODO(), $MODEL, $CONTENTS, $CONFIG, ...)
      # Official streaming variants (#232) — direct literal-context calls.
      # Escaped-context (context.WithTimeout) handling for qualified streaming
      # shapes is covered by the generic $METHOD patterns above for unqualified
      # receivers; qualified receivers only match the direct forms here.
      - pattern-either:
          - pattern: $CLIENT.Chat.Completions.NewStreaming(context.Background(), $REQ, ...)
          - pattern: $CLIENT.Chat.Completions.NewStreaming(context.TODO(), $REQ, ...)
          - pattern: $CLIENT.Responses.NewStreaming(context.Background(), $REQ, ...)
          - pattern: $CLIENT.Responses.NewStreaming(context.TODO(), $REQ, ...)
          - pattern: $CLIENT.Messages.NewStreaming(context.Background(), $REQ, ...)
          - pattern: $CLIENT.Messages.NewStreaming(context.TODO(), $REQ, ...)
          - pattern: $CLIENT.ConverseStream(context.Background(), $REQ, ...)
          - pattern: $CLIENT.ConverseStream(context.TODO(), $REQ, ...)
          - pattern: $CLIENT.InvokeModelWithResponseStream(context.Background(), $REQ, ...)
          - pattern: $CLIENT.InvokeModelWithResponseStream(context.TODO(), $REQ, ...)
          - pattern: $CLIENT.Models.GenerateContentStream(context.Background(), $MODEL, $CONTENTS, $CONFIG, ...)
          - pattern: $CLIENT.Models.GenerateContentStream(context.TODO(), $MODEL, $CONTENTS, $CONFIG, ...)
      - patterns:
          - pattern: |
              $CTX := context.Background()
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
      - patterns:
          - pattern: |
              $CTX := context.Background()
              ...
              $CLIENT.Responses.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Responses.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Responses.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Responses.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Responses.New($CTX, $REQ, ...)
      - patterns:
          - pattern: |
              $CTX := context.Background()
              ...
              $CLIENT.Messages.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Messages.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Messages.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Messages.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Messages.New($CTX, $REQ, ...)
      - patterns:
          - pattern: |
              $CTX := context.Background()
              ...
              $CLIENT.Converse($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Converse($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Converse($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Converse($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Converse($CTX, $REQ, ...)
      - patterns:
          - pattern: |
              $CTX := context.Background()
              ...
              $CLIENT.InvokeModel($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.InvokeModel($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.InvokeModel($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.InvokeModel($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.InvokeModel($CTX, $REQ, ...)
      - patterns:
          - pattern: |
              $CTX := context.Background()
              ...
              $CLIENT.Models.GenerateContent($CTX, $MODEL, $CONTENTS, $CONFIG, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Models.GenerateContent($CTX, $MODEL, $CONTENTS, $CONFIG, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Models.GenerateContent($CTX, $MODEL, $CONTENTS, $CONFIG, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Models.GenerateContent($CTX, $MODEL, $CONTENTS, $CONFIG, ...)
          - pattern-not: |
              $CTX := context.Background()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Models.GenerateContent($CTX, $MODEL, $CONTENTS, $CONFIG, ...)
      - patterns:
          - pattern: |
              $CTX := context.TODO()
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.TODO()
              ...
              $CTX, $_ := context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.TODO()
              ...
              $CTX, $_ = context.WithTimeout($CTX, ...)
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.TODO()
              ...
              $CTX, $_ := context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
          - pattern-not: |
              $CTX := context.TODO()
              ...
              $CTX, $_ = context.WithDeadline($CTX, ...)
              ...
              $CLIENT.Chat.Completions.New($CTX, $REQ, ...)
